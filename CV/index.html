      // Reads the user's stored theme (or system preference) and stamps it
      // onto <html>. Runs on initial load AND after every ClientRouter swap,
      // so navigating between pages never overrides the user's choice.
      const applyTheme = () => {
        const theme = (typeof localStorage !== 'undefined' && localStorage.getItem('theme'))
          || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      const initToggle = () => {
        document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
          if (btn.dataset.toggleInit === '1') return;
          btn.dataset.toggleInit = '1';
          btn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
          });
        });
      };

      applyTheme();
      initToggle();

      // Re-apply theme after each ClientRouter navigation, because the
      // incoming <html class="dark"> from the new page would otherwise
      // override the user's saved preference.
      document.addEventListener('astro:after-swap', () => {
        applyTheme();
        initToggle();
      });
